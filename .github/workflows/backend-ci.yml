name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb:2.28.3-pg17
        env:
          POSTGRES_USER: monitor_ci
          POSTGRES_DB: monitor
          # En claro a proposito, no en GitHub Secrets: esta base vive tres
          # minutos en un contenedor aislado del job y no protege ningun dato
          # real. Si fuera un secret, GitHub la enmascararia tambien dentro
          # de la URL de conexion que aparece en los mensajes de error de
          # SQLAlchemy, tapando justo el dato que hace falta para diagnosticar.
          POSTGRES_PASSWORD: contrasena_descartable_de_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor_ci -d monitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: monitor_ci
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD: contrasena_descartable_de_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # astral-sh/setup-uv v9.0.0, fijada por SHA de commit por ser una
        # accion de terceros (no de GitHub).
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
