name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Solo reporta: no bloquea el build si aparecen vulnerabilidades.
      # Ver docs/SEGURIDAD.md para el criterio de cuáles se resuelven y cuáles quedan documentadas.
      - name: Audit dependencies (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
